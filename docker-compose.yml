version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: africonnect-db
    restart: always
    environment:
      POSTGRES_USER: afri
      POSTGRES_PASSWORD: afri
      POSTGRES_DB: afri
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: africonnect-adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
